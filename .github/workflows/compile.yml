name: Compile

on:
  push:
    branches: [ "legacy" ]

jobs:
  android:
    name: Android APK (Cross-Compiled)
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your Saturn source code
    - name: Checkout Saturn Repo
      uses: actions/checkout@v4
      with:
        path: saturn-src

    # 2. Pull down the official Android wrapper environment
    - name: Clone Android Wrapper Base
      run: |
        git clone --recursive https://github.com android-base

    # 3. Setup Android tools and compiler environments
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android NDK & SDK
      uses: android-actions/setup-android@v3

    - name: Fetch Linux Core Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3 curl libjsoncpp-dev libpng-dev

    # 4. Inject Saturn's codebase into the Android JNI structure
    - name: Overlay Saturn Source Code into Wrapper
      run: |
        # Clear out vanilla target directories
        rm -rf android-base/app/jni/src/*
        # Copy your repository's custom code base into the compilation container
        cp -R saturn-src/* android-base/app/jni/src/

    # 5. Extract ROM assets safely inside the compilation container
    - name: Prepare and Extract ROM Assets
      env:
        BASEROM_BASE64: ${{ secrets.BASEROM_US_BASE64 }}
      run: |
        cd android-base/app/jni/src
        # Decode your secure GitHub Repository text secret back into the binary ROM
        if [ ! -z "$BASEROM_BASE64" ]; then
          echo "$BASEROM_BASE64" | base64 --decode > baserom.us.z64
        else
          echo "ERROR: BASEROM_US_BASE64 secret is empty or missing!" && exit 1
        fi
        
        # Trigger your code extraction script
        if [ -f "extract_assets.py" ]; then
          python3 extract_assets.py us
        elif [ -f "extracted.py" ]; then
          python3 extracted.py us
        fi

    # 6. Run Gradle to compile C/C++ architecture into an ARM .apk file
    - name: Compile APK via Gradle Wrapper
      run: |
        cd android-base
        chmod +x ./gradlew
        # Compiles the NDK native libraries and packages your APK
        ./gradlew assembleDebug

    # 7. Deliver your working installer package
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: saturn-legacy-android-apk
        path: android-base/app/build/outputs/apk/debug/app-debug.apk
